name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Check formatting
        run: cargo fmt --all -- --check

  inspect-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: crates/router-inspect/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/router-inspect/web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/router-inspect/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Test session tree
        run: pnpm test:tree

      - name: Build viewer
        run: pnpm build

      - name: Check generated viewer assets
        run: git diff --exit-code -- dist

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MODELS_DEV_SNAPSHOT: vendor/models.dev.json
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Check Python Cargo build on macOS
        if: runner.os == 'macOS'
        run: cargo build --locked --package tokn-python

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist

      - name: Install Python wheel
        run: python -m pip install dist/*.whl

      - name: Test Python SDK
        run: python -m unittest discover -s bindings/python/tests

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODELS_DEV_SNAPSHOT: vendor/models.dev.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Generate coverage report
        run: >-
          cargo llvm-cov --locked --workspace --all-features
          --ignore-filename-regex 'bindings/python/src/lib\.rs'
          --codecov --output-path codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          use_oidc: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Build default Rust workspace
        run: cargo build --locked --all-features

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: tokn-gateway-cli:ci
      IMAGE_TAR: /tmp/tokn-gateway-cli-image.tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tokn-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ env.IMAGE_TAR }}

      - name: Upload tokn-gateway image artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokn-gateway-cli-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
