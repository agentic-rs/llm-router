schema_version = 2

[listeners.api]
kind = "llm_api"
bind = "127.0.0.1:4141"
client_auth = "none"

[profiles.default]
route = "default"
account_pool = {}

[routes.default]
kind = "managed"
operation = "translate_compatible"
provider = { kind = "any" }
model = { kind = "capability" }
retry = { kind = "recoverable", policy = "legacy-recoverable" }

[retry_policies.legacy-recoverable]
max_retries = 2
initial_backoff_ms = 100
