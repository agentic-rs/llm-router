[package]
name = "tokn-gateway-cli"
version.workspace = true
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
description = "CLI and local gateway runtime for serving OpenAI-compatible APIs via tokn"
license.workspace = true
readme = "../../README.md"

[features]
default = ["lzma"]
lzma = ["tokn-persistence/lzma"]

[[bin]]
name = "tokn-gateway"
path = "src/main.rs"

[dependencies]
tokn-accounts = { workspace = true }
tokn-core = { workspace = true }
tokn-config = { workspace = true }
tokn-events = { workspace = true }
tokn-policy = { workspace = true }
tokn-router-legacy-config = { workspace = true }
tokn-agent-migration = { workspace = true }
tokn-catalogue = { workspace = true }
tokn-router = { workspace = true }
tokn-router-inspect = { workspace = true }
tokn-requests = { workspace = true }
tokn-persistence = { workspace = true }
tokn-provider-copilot = { workspace = true }
tokn-auth = { workspace = true }
tokn-access = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
humantime = { workspace = true }
indicatif = { workspace = true }
inquire = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokn-mock-server = { workspace = true }
