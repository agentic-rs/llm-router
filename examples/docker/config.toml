schema_version = 2

[service.logging]
target = "stderr"

[listeners.api]
kind = "llm_api"
bind = "0.0.0.0:4141"
client_auth = "local_keys"
# This is the container interface, NOT permission to publish HTTP publicly.
# Required Docker mapping: -p 127.0.0.1:4141:4141 (see docs/docker.md).
# Never use -p 4141:4141 or --network host with this plaintext example.
# Remote clients must use a TLS reverse proxy with an isolated backend.
# This opt-in does not encrypt bearer tokens or disable authentication.
allow_insecure_public = true

[profiles.default]
route = "default"

[routes.default]
kind = "managed"
provider = { kind = "any" }
model = { kind = "capability" }
operation = "translate_compatible"
